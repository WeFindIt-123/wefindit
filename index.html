<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeFindIt — AI Travel Deals</title>
<style>
body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;color:#111827}
h1{margin-bottom:4px}
.sub{color:#6b7280;margin-top:0}
section{background:#f9fafb;padding:16px;border-radius:10px;margin:20px 0}
label{display:block;font-size:13px;color:#374151;margin-bottom:4px}
input,select,button{padding:8px 12px;font-size:14px;border-radius:6px;border:1px solid #d1d5db;width:100%;box-sizing:border-box}
button{background:#111827;color:#fff;border:none;cursor:pointer;margin-top:12px;width:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.alert{border:1px solid #e5e7eb;border-radius:8px;padding:14px;margin:10px 0;background:#fff}
.status{font-size:13px;color:#6b7280;margin-top:8px}
.watch{font-size:12px;background:#e5e7eb;color:#111;border:none;padding:4px 8px;border-radius:4px;cursor:pointer}
#auth{display:flex;gap:8px;align-items:end}
#auth input{width:auto;flex:1}
</style>
</head>
<body>
<h1>WeFindIt</h1>
<p class="sub">AI travel deals — flights + hotels</p>

<section id="authSection">
<strong>Account</strong>
<div id="auth" style="margin-top:10px">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Sign up</button>
<button onclick="login()">Log in</button>
</div>
<div id="authStatus" class="status"></div>
</section>

<section>
<strong>Search</strong>
<div class="grid" style="margin-top:10px">
<label>From<input id="from" value="JFK"></label>
<label>To<input id="to" value="LHR"></label>
</div>
<div class="grid3" style="margin-top:10px">
<label>Departure<input id="date" type="date"></label>
<label>Cabin<select id="cabin"><option value="economy">Economy</option><option value="premium_economy">Premium</option><option value="business">Business</option><option value="first">First</option></select></label>
<label>Nights<input id="nights" type="number" value="3" min="1" max="14"></label>
</div>
<button id="btn" onclick="search()">Search deals</button>
<div id="status" class="status"></div>
</section>

<div id="results"></div>

<section>
<strong>Watched routes</strong>
<div id="watched" class="status">Log in to save routes</div>
</section>

<script>
document.getElementById("date").value = new Date(Date.now()+14*86400000).toISOString().slice(0,10);

let session = JSON.parse(localStorage.getItem("wefindit_session") || "null");

function setAuthStatus(msg){ document.getElementById("authStatus").textContent = msg; }
function renderWatched(){
  const list = session?.watched || [];
  document.getElementById("watched").innerHTML = list.length
    ? list.map((w,i)=>`<div>${w.from} → ${w.to} · ${w.date} · ${w.cabin||"economy"} <button class="watch" onclick="unwatch(${i})">Remove</button></div>`).join("")
    : (session ? "None yet" : "Log in to save routes");
}
if(session){ setAuthStatus("Logged in as " + session.email); renderWatched(); }

async function signup(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const res = await fetch("/api/auth/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  const data = await res.json();
  if(data.ok){ setAuthStatus("Account created — now log in"); }
  else setAuthStatus(data.error || "Signup failed");
}
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const res = await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  const data = await res.json();
  if(data.ok){
    session = { email, password, watched: data.watched || [] };
    localStorage.setItem("wefindit_session", JSON.stringify(session));
    setAuthStatus("Logged in as " + email);
    renderWatched();
  } else setAuthStatus(data.error || "Login failed");
}
async function watchRoute(){
  if(!session){ setAuthStatus("Log in first to watch routes"); return; }
  const route = { from:document.getElementById("from").value||"JFK", to:document.getElementById("to").value||"LHR", date:document.getElementById("date").value, cabin:document.getElementById("cabin").value };
  const res = await fetch("/api/auth/watch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:session.email,password:session.password,route})});
  const data = await res.json();
  if(data.ok){ session.watched = data.watched; localStorage.setItem("wefindit_session", JSON.stringify(session)); renderWatched(); }
}
async function unwatch(i){
  if(!session) return;
  const res = await fetch("/api/auth/unwatch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:session.email,password:session.password,index:i})});
  const data = await res.json();
  if(data.ok){ session.watched = data.watched; localStorage.setItem("wefindit_session", JSON.stringify(session)); renderWatched(); }
}

async function search(){
  const from=document.getElementById("from").value||"JFK";
  const to=document.getElementById("to").value||"LHR";
  const date=document.getElementById("date").value;
  const cabin=document.getElementById("cabin").value;
  const nights=Number(document.getElementById("nights").value)||3;
  const btn=document.getElementById("btn");
  const status=document.getElementById("status");
  btn.disabled=true; status.textContent="Searching…";
  try{
    const res=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({origin:from,destination:to,departure_date:date,cabin_class:cabin,nights})});
    const data=await res.json();
    status.textContent = data.source==="duffel" ? "Live Duffel results" : "Demo results";
    let html = "";
    if(data.flights?.length){
      html += "<h2>Flights</h2>" + data.flights.map(f=>`
        <article class="alert">
          <h3 style="margin:0 0 6px">${from} → ${to} from ${f.currency} ${f.price}</h3>
          <p style="margin:0">${f.airline} · ${f.stops===0?"Nonstop":f.stops+" stop(s)"} · ${cabin}</p>
        </article>`).join("");
    }
    if(data.hotels?.length){
      html += "<h2>Hotels in "+to+"</h2>" + data.hotels.map(h=>`
        <article class="alert">
          <h3 style="margin:0 0 6px">${h.name}</h3>
          <p style="margin:0">${h.currency} ${h.price} total · ${h.rating||"—"}★</p>
        </article>`).join("");
    }
    html += `<button class="watch" onclick="watchRoute()">Watch this route</button>`;
    document.getElementById("results").innerHTML = html || "<p>No results.</p>";
  }catch(e){ status.textContent="Error: "+e.message; }
  finally{ btn.disabled=false; }
}
</script>
</body>
</html>
