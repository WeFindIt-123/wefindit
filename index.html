<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeFindIt — AI Travel Deals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2e3a;--text:#e8eaed;--muted:#8b90a0;--accent:#3b82f6;--accent2:#22c55e;--radius:12px}
*{box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.5}
.container{max-width:900px;margin:0 auto;padding:32px 20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-0.5px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.card h2{font-size:16px;font-weight:600;margin:0 0 16px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
input,select,button{font-family:inherit;font-size:14px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:#0f1117;color:var(--text);width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
button{background:var(--accent);color:#fff;border:none;font-weight:500;cursor:pointer;width:auto;padding:10px 20px;margin-top:16px}
button:hover{background:#2563eb}
button.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.offer{background:#0f1117;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.offer-left h3{margin:0 0 4px;font-size:15px;font-weight:600}
.offer-left p{margin:0;font-size:13px;color:var(--muted)}
.score{font-size:18px;font-weight:700;color:var(--accent2);min-width:40px;text-align:right}
.auth-row{display:flex;gap:8px;align-items:end}
.auth-row input{flex:1}
.status{font-size:13px;color:var(--muted);margin-top:8px}
.suggest{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-height:220px;overflow:auto;z-index:20;width:calc(100% - 40px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.suggest div{padding:10px 12px;cursor:pointer;font-size:13px}
.suggest div:hover{background:#2a2e3a}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#1e3a5f;color:#93c5fd;margin-left:8px}
.watch-btn{font-size:12px;background:transparent;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;margin-top:12px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
</style>
</head>
<body>
<div class="container">
<header>
<div>
<h1>WeFindIt</h1>
<div class="sub">AI-powered travel deals</div>
</div>
<div id="userBadge" class="status"></div>
</header>

<div class="card">
<h2>Account</h2>
<div class="auth-row">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Sign up</button>
<button class="secondary" onclick="login()">Log in</button>
</div>
<div id="authStatus" class="status"></div>
</div>

<div class="card">
<h2>Search</h2>
<div class="grid">
<div><label>From</label><input id="from" value="JFK" autocomplete="off" placeholder="City or airport"></div>
<div><label>To</label><input id="to" value="LHR" autocomplete="off" placeholder="City or airport"></div>
</div>
<div id="fromSuggest" class="suggest"></div>
<div id="toSuggest" class="suggest"></div>
<div class="grid3" style="margin-top:12px">
<div><label>Departure</label><input id="date" type="date"></div>
<div><label>Cabin</label><select id="cabin"><option value="economy">Economy</option><option value="premium_economy">Premium</option><option value="business">Business</option><option value="first">First</option></select></div>
<div><label>Nights</label><input id="nights" type="number" value="3" min="1" max="14"></div>
</div>
<button id="btn" onclick="search()">Search deals</button>
<div id="status" class="status"></div>
</div>

<div id="results"></div>

<div class="card">
<h2>Watched routes</h2>
<div id="watched" class="status">Log in to save routes</div>
</div>

<footer>WeFindIt · Powered by Duffel</footer>
</div>

<script type="module">
import { searchAirports } from "./airports.js";
function setupSuggest(inputId, suggestId) {
  const input = document.getElementById(inputId);
  const box = document.getElementById(suggestId);
  input.addEventListener("input", () => {
    const q = input.value.trim();
    const matches = searchAirports(q);
    if (!matches.length) { box.innerHTML = ""; box.style.display = "none"; return; }
    box.style.display = "block";
    box.innerHTML = matches.map(a => `<div data-code="${a.code}">${a.city} (${a.code}) — ${a.name}</div>`).join("");
    box.querySelectorAll("div").forEach(d => d.onclick = () => { input.value = d.dataset.code; box.innerHTML = ""; box.style.display = "none"; });
  });
  document.addEventListener("click", e => { if (!box.contains(e.target) && e.target !== input) box.style.display = "none"; });
}
setupSuggest("from", "fromSuggest");
setupSuggest("to", "toSuggest");
</script>
<script>
document.getElementById("date").value = new Date(Date.now()+14*86400000).toISOString().slice(0,10);

let session = JSON.parse(localStorage.getItem("wefindit_session") || "null");

function setAuthStatus(msg){ document.getElementById("authStatus").textContent = msg; }
function renderWatched(){
  const list = session?.watched || [];
  document.getElementById("watched").innerHTML = list.length
    ? list.map((w,i)=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)">${w.from} → ${w.to} · ${w.date} · ${w.cabin||"economy"} <button class="watch-btn" onclick="unwatch(${i})">Remove</button></div>`).join("")
    : (session ? "None yet" : "Log in to save routes");
}
if(session){ setAuthStatus(""); document.getElementById("userBadge").innerHTML = `<span class="badge">${session.email}</span>`; renderWatched(); }

async function signup(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const res = await fetch("/api/auth/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  const data = await res.json();
  setAuthStatus(data.ok ? "Account created — now log in" : (data.error || "Signup failed"));
}
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const res = await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  const data = await res.json();
  if(data.ok){
    session = { email, password, watched: data.watched || [] };
    localStorage.setItem("wefindit_session", JSON.stringify(session));
    setAuthStatus("");
    document.getElementById("userBadge").innerHTML = `<span class="badge">${email}</span>`;
    renderWatched();
  } else setAuthStatus(data.error || "Login failed");
}
async function watchRoute(){
  if(!session){ setAuthStatus("Log in first to watch routes"); return; }
  const route = { from:document.getElementById("from").value||"JFK", to:document.getElementById("to").value||"LHR", date:document.getElementById("date").value, cabin:document.getElementById("cabin").value };
  const res = await fetch("/api/auth/watch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:session.email,password:session.password,route})});
  const data = await res.json();
  if(data.ok){ session.watched = data.watched; localStorage.setItem("wefindit_session", JSON.stringify(session)); renderWatched(); }
}
async function unwatch(i){
  if(!session) return;
  const res = await fetch("/api/auth/unwatch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:session.email,password:session.password,index:i})});
  const data = await res.json();
  if(data.ok){ session.watched = data.watched; localStorage.setItem("wefindit_session", JSON.stringify(session)); renderWatched(); }
}

async function search(){
  const from=document.getElementById("from").value||"JFK";
  const to=document.getElementById("to").value||"LHR";
  const date=document.getElementById("date").value;
  const cabin=document.getElementById("cabin").value;
  const nights=Number(document.getElementById("nights").value)||3;
  const btn=document.getElementById("btn");
  const status=document.getElementById("status");
  btn.disabled=true; status.textContent="Searching…";
  try{
    const res=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({origin:from,destination:to,departure_date:date,cabin_class:cabin,nights})});
    const data=await res.json();
    status.textContent = data.source==="duffel" ? "Live results" : "Demo results";
    let html = "";
    if(data.flights?.length){
      html += `<div class="card"><h2>Flights <span class="badge">ranked by score</span></h2>` + data.flights.map(f=>`
        <div class="offer">
          <div class="offer-left">
            <h3>${from} → ${to} · ${f.currency} ${f.price}</h3>
            <p>${f.airline} · ${f.stops===0?"Nonstop":f.stops+" stop(s)"} · ${cabin}</p>
          </div>
          <div class="score">${f.score||"—"}</div>
        </div>`).join("") + `<button class="watch-btn" onclick="watchRoute()">Watch this route</button></div>`;
    }
    if(data.hotels?.length){
      html += `<div class="card"><h2>Hotels in ${to}</h2>` + data.hotels.map(h=>`
        <div class="offer">
          <div class="offer-left">
            <h3>${h.name}</h3>
            <p>${h.currency} ${h.price} total · ${h.rating||"—"}★</p>
          </div>
        </div>`).join("") + `</div>`;
    }
    document.getElementById("results").innerHTML = html || `<div class="card"><p>No results.</p></div>`;
  }catch(e){ status.textContent="Error: "+e.message; }
  finally{ btn.disabled=false; }
}
</script>
</body>
</html>
